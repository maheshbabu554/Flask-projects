{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5">
            <div class="mb-3">
                <i class="bi bi-search text-warning display-1"></i>
            </div>
            <h2 class="fw-bold text-navy mb-2">404 — Record Not Found</h2>
            <p class="text-muted mb-4">
                The requested resource or claim ID could not be located in the database.
            </p>
            <div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-navy px-4">
                    <i class="bi bi-house-door me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
