{% extends "base.html" %}
{% block title %}Search Weather - WeatherApp{% endblock %}
{% block content %}
<section class="page"><h1 class="page-title">Search Weather</h1>
  <form class="search-box light autocomplete-form" action="{{ url_for('search') }}" method="get" autocomplete="off">
    <i class="bi bi-search"></i><div class="autocomplete-wrap"><input type="text" name="city" maxlength="100" placeholder="Search city..." required aria-label="Search city"><div class="suggestions" role="listbox"></div></div><button type="submit">Search</button>
  </form>
  {% if error %}<div class="flash error inline-message">{{ error }}</div>{% endif %}
  {% if weather %}{% include "_weather.html" %}{% endif %}
</section>
{% endblock %}
