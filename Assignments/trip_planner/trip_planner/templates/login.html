{% extends 'base.html' %}{% block title %}Log in | Triply{% endblock %}{% block content %}
<div class="auth-wrap container"><div class="auth-card"><div class="auth-symbol">↗</div><div class="eyebrow justify-content-center">WELCOME BACK</div><h1>Pick up where you left off.</h1><p class="auth-subtitle">Your plans are waiting for you.</p><form method="post" class="needs-validation" novalidate><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control form-control-lg" type="email" id="email" name="email" autocomplete="email" required><div class="invalid-feedback">Enter your email address.</div></div><div class="mb-4"><label class="form-label" for="password">Password</label><div class="input-group input-group-lg"><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required><button class="btn btn-outline-secondary password-toggle" type="button" data-toggle-password="password">Show</button></div></div><button class="btn btn-primary btn-lg w-100 rounded-pill" type="submit">Log in <span aria-hidden="true">→</span></button></form><p class="auth-switch">New to Triply? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
