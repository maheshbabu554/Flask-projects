{% extends 'base.html' %}{% block title %}Suggest a place | Triply{% endblock %}{% block content %}
<section class="container form-page"><a class="back-link" href="{{ url_for('explore') }}">← Back to Explore</a><div class="form-panel"><div class="eyebrow">SHARE A LITTLE INSPIRATION</div><h1>A place worth sharing.</h1><p class="form-intro">Add a suggestion to the public Explore page so other travellers can discover it.</p><form method="post" class="needs-validation" novalidate><div class="mb-3"><label class="form-label" for="name">Place name</label><input class="form-control form-control-lg" id="name" name="name" minlength="2" maxlength="120" value="{{ request.form.get('name','') }}" required></div><div class="mb-3"><label class="form-label" for="destination">Destination / city</label><input class="form-control form-control-lg" id="destination" name="destination" minlength="2" maxlength="120" value="{{ request.form.get('destination','') }}" required></div><div class="mb-3"><label class="form-label" for="category">Category</label><select class="form-select form-select-lg" id="category" name="category" required><option value="">Choose a category</option>{% for item in categories %}<option value="{{ item }}" {% if request.form.get('category') == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="mb-4"><label class="form-label" for="description">Why should people visit?</label><textarea class="form-control" id="description" name="description" rows="4" minlength="10" maxlength="500" required>{{ request.form.get('description','') }}</textarea><div class="form-text">10–500 characters.</div></div><button class="btn btn-primary btn-lg rounded-pill px-4" type="submit">Share suggestion →</button></form></div></section>{% endblock %}
