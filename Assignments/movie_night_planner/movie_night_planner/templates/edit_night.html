
{% extends "base.html" %}
{% block title %}Edit Movie Night{% endblock %}

{% block content %}
<div class="form-card card shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="h2 fw-bold">Edit movie night</h1>
        <p class="text-secondary mb-4">Update your plan details.</p>

        <form method="POST" action="{{ url_for('edit_night', night_id=night.id) }}">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input class="form-control" id="title" name="title"
                       maxlength="150" required
                       value="{{ request.form.get('title', night.title) }}">
            </div>

            <div class="mb-3">
                <label for="night_date" class="form-label">Date</label>
                <input class="form-control" type="date" id="night_date"
                       name="night_date" required
                       value="{{ request.form.get('night_date', night.night_date.isoformat()) }}">
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category" required>
                    {% for item in categories %}
                        <option value="{{ item }}"
                          {% if request.form.get('category', night.category) == item %}selected{% endif %}>
                            {{ item }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description"
                          rows="4" maxlength="500" required>{{ request.form.get('description', night.description) }}</textarea>
            </div>

            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a href="{{ url_for('night_detail', night_id=night.id) }}"
               class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
