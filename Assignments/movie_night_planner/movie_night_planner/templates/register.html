
{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="form-card card shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="h2 fw-bold mb-2">Create your account</h1>
        <p class="text-secondary mb-4">Join your friends and plan movie nights.</p>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Full name</label>
                <input class="form-control" id="name" name="name"
                       maxlength="100" required value="{{ request.form.get('name', '') }}">
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input class="form-control" id="username" name="username"
                       minlength="3" maxlength="50" pattern="[A-Za-z0-9_]{3,50}"
                       required value="{{ request.form.get('username', '') }}">
                <div class="form-text">Use letters, numbers, or underscores.</div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input class="form-control" type="password" id="password"
                       name="password" minlength="8" maxlength="128" required>
                <div class="form-text">Use at least 8 characters.</div>
            </div>

            <button class="btn btn-primary w-100" type="submit">Register</button>
        </form>

        <p class="text-center mt-4 mb-0">
            Already registered? <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
