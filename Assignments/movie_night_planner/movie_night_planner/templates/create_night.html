
{% extends "base.html" %}
{% block title %}Create Movie Night{% endblock %}

{% block content %}
<div class="form-card card shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="h2 fw-bold">Create a movie night</h1>
        <p class="text-secondary mb-4">Start a plan and invite others to vote.</p>

        <form method="POST" action="{{ url_for('create_night') }}">
            <div class="mb-3">
                <label for="title" class="form-label">Movie night title</label>
                <input class="form-control" id="title" name="title"
                       maxlength="150" required
                       value="{{ request.form.get('title', '') }}"
                       placeholder="Friday Movie Night">
            </div>

            <div class="mb-3">
                <label for="night_date" class="form-label">Date</label>
                <input class="form-control" type="date" id="night_date"
                       name="night_date" required
                       value="{{ request.form.get('night_date', '') }}">
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="">Choose a category</option>
                    {% for item in categories %}
                        <option value="{{ item }}"
                          {% if request.form.get('category') == item %}selected{% endif %}>
                            {{ item }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label">Short description</label>
                <textarea class="form-control" id="description" name="description"
                          rows="4" maxlength="500" required
                          placeholder="Tell everyone about the plan...">{{ request.form.get('description', '') }}</textarea>
            </div>

            <button class="btn btn-primary" type="submit">Create Movie Night</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
