{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container my-5 py-5 text-center">
    <div class="card card-cinema p-5 mx-auto" style="max-width: 540px;">
        <div class="mb-3">
            <span class="brand-icon mx-auto" style="width: 64px; height: 64px; font-size: 2rem;">
                <i class="bi bi-exclamation-triangle"></i>
            </span>
        </div>
        <h1 class="display-5 fw-bold text-white mb-2">404</h1>
        <h2 class="h4 text-light mb-3">Movie Night Not Found</h2>
        <p class="text-secondary mb-4">
            The page or movie night you are looking for doesn't exist, has been removed, or the link is incorrect.
        </p>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-cinema rounded-pill px-4">
                <i class="bi bi-house-door me-1"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
