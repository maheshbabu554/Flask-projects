{% extends "base.html" %}
{% block title %}Search Weather - WeatherApp{% endblock %}

{% block content %}
<section class="page">
    <h1 class="page-title">Search Weather</h1>

    <form class="search-box light" action="{{ url_for('search') }}" method="get">
        <i class="bi bi-search"></i>
        <input type="text" name="city" maxlength="100" placeholder="Search city..." required>
        <button type="submit">Search</button>
    </form>

    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}

    {% if weather %}
        {% include "_weather.html" %}
    {% endif %}
</section>
{% endblock %}
