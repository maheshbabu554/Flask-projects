{% extends "base.html" %}
{% block title %}Edit User | HireWise AI{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="mb-4"><h2 class="fw-bold">Edit Workspace User</h2><p class="text-muted mb-0">Update the user's name, email and workspace role.</p></div><div class="card"><div class="card-body p-4"><form method="POST"><div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" value="{{ user.email }}" maxlength="120" required></div><div class="mb-4"><label class="form-label" for="role">Workspace role</label><select class="form-select" id="role" name="role"><option value="recruiter" {% if user.role == 'recruiter' %}selected{% endif %}>Recruiter</option><option value="placement_coordinator" {% if user.role == 'placement_coordinator' %}selected{% endif %}>Placement Coordinator</option></select></div><button class="btn btn-primary" type="submit">Save Changes</button><a class="btn btn-outline-secondary ms-2" href="{{ url_for('admin.users') }}">Cancel</a></form></div></div></div></div>
{% endblock %}
