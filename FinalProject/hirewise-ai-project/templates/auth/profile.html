{% extends "base.html" %}
{% block title %}My Profile | HireWise AI{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="mb-4"><h2 class="fw-bold">My Profile</h2><p class="text-muted mb-0">Update your account information.</p></div><div class="card"><div class="card-body p-4"><form method="POST"><div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" maxlength="100" value="{{ current_user.full_name }}" required></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" maxlength="120" value="{{ current_user.email }}" required></div><div class="mb-3"><label class="form-label">Role</label><input class="form-control" value="{{ current_user.role|title }}" disabled></div><button class="btn btn-primary" type="submit">Save Profile</button><a class="btn btn-outline-secondary ms-2" href="{{ url_for('auth.change_password') }}">Change Password</a></form></div></div></div></div>
{% endblock %}
