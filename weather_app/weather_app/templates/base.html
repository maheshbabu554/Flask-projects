<!DOCTYPE html>
<!--
  base.html : the common layout (sidebar + content area).
  Every other page "extends" this file and only fills the content block.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherApp - {% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-{{ active }}">
  <div class="app-shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <a class="logo" href="{{ url_for('home_page') }}">
        <svg viewBox="0 0 64 64" width="44" height="44">
          <g transform="translate(-4,-6)">
            <g stroke="#FFB300" stroke-width="4" stroke-linecap="round">
              <line x1="26" y1="8" x2="26" y2="14"/><line x1="8" y1="26" x2="14" y2="26"/>
              <line x1="13" y1="13" x2="17" y2="17"/><line x1="39" y1="13" x2="35" y2="17"/>
            </g>
            <circle cx="26" cy="26" r="10" fill="#FFC83D"/>
          </g>
          <path d="M20 54a10 10 0 0 1-1.5-19.9A14 14 0 0 1 46 36a9 9 0 0 1 1 18z" fill="#7DB5FF"/>
        </svg>
        <span>Weather<b>App</b></span>
      </a>

      <nav class="menu">
        <a href="{{ url_for('home_page') }}" class="{{ 'active' if active == 'home' }}">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</a>
        <a href="{{ url_for('search_page') }}" class="{{ 'active' if active == 'search' }}">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Search</a>
        <a href="{{ url_for('cities_page') }}" class="{{ 'active' if active == 'cities' }}">
          <svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>My Cities</a>
        <a href="{{ url_for('history_page') }}" class="{{ 'active' if active == 'history' }}">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
        <a href="{{ url_for('settings_page') }}" class="{{ 'active' if active == 'settings' }}">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</a>
      </nav>

      <div class="sidebar-footer">
        <svg viewBox="0 0 24 24"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 4v3M4.5 9.5l2 2M19.5 9.5l-2 2"/></svg>
        <span>Better Weather<br>Brighter Days</span>
      </div>
    </aside>

    <!-- ============ PAGE CONTENT ============ -->
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Messages ("City fetched successfully" etc.) appear here -->
  <div id="toast-container"></div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
